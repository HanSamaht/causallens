[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causallens"
version = "0.1.0"
description = "Make all black-box models transparent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "shap>=0.44",
    "requests>=2.28",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
onnx = ["onnxruntime>=1.16", "skl2onnx>=1.16"]
mcp-http = ["mcp>=1.8"]
pysr = ["pysr>=1.0"]
causal-learn = ["causal-learn>=0.1.3"]
all = ["torch>=2.0", "onnxruntime>=1.16", "skl2onnx>=1.16", "mcp>=1.8", "causal-learn>=0.1.3"]

[project.scripts]
causallens = "causallens.cli:main"

[tool.setuptools.packages.find]
include = ["causallens*"]
