[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causallens"
version = "0.3.0"
description = "Make all black-box models transparent"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "CausalLens contributors" }]
keywords = [
    "interpretability", "explainability", "causal-inference", "machine-learning",
    "shap", "counterfactual", "fairness", "model-audit", "interrogation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "shap>=0.44",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/HanSamaht/causallens"
Documentation = "https://hansamaht.github.io/causallens/"
Issues = "https://github.com/HanSamaht/causallens/issues"
Changelog = "https://github.com/HanSamaht/causallens/releases"

[project.optional-dependencies]
torch = ["torch>=2.0"]
onnx = ["onnxruntime>=1.16", "skl2onnx>=1.16"]
mcp-http = ["mcp>=1.8"]
pysr = ["pysr>=1.0"]
causal-learn = ["causal-learn>=0.1.3"]
dowhy = ["dowhy>=0.12"]
tigramite = ["tigramite>=5.2"]
all = ["torch>=2.0", "onnxruntime>=1.16", "skl2onnx>=1.16", "mcp>=1.8", "causal-learn>=0.1.3", "dowhy>=0.12", "tigramite>=5.2"]

[project.scripts]
causallens = "causallens.cli:main"

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that train demo models, minutes each; deselect with -m 'not slow'",
]

[tool.setuptools.packages.find]
include = ["causallens*"]
