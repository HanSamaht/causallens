name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  fast-tests:
    name: fast suite (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn shap pandas requests lightgbm pytest causal-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fast unit tests (slow end-to-end deselected)
        run: python -m pytest tests/ -m "not slow" -q
      - name: Self-validation probes
        run: python -m intervense probe
        continue-on-error: true
