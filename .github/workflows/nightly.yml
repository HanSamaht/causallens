name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: full suite including slow end-to-end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn shap pandas requests lightgbm pytest causal-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full test suite
        run: python -m pytest tests/ -q
      - name: Self-validation probes
        run: python -m causallens probe

  kaggle-smoke:
    name: Kaggle artifact smoke (needs KAGGLE_MODELS_DIR on self-hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn shap pandas requests lightgbm joblib causal-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the Kaggle causal suite when artifacts are present
        run: python examples/kaggle_causal_suite.py
        env:
          KAGGLE_MODELS_DIR: ${{ secrets.KAGGLE_MODELS_DIR }}
